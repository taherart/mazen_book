name: Deploy to VPS

# Every push to main goes live on the VPS's Docker project (see deploy/README.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # gate: never send the VPS a commit that doesn't lint or build
      - run: pnpm lint
      - run: pnpm build

      - name: Deploy through Hostinger's Docker Manager
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: python3 deploy/hostinger.py "$GITHUB_SHA"
